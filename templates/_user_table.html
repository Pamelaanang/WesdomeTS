{% comment %}People in User Management as a grid of cards. Pass people; show_department adds the department to each card.{% endcomment %}
<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    {% for user in people %}
    {% include '_user_card.html' %}
    {% empty %}
    <div class="col-span-full bg-white rounded-2xl shadow p-6 text-center text-gray-400 text-sm">{{ empty_text|default:"Nobody here." }}</div>
    {% endfor %}
</div>
