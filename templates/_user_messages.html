{% if messages %}
<div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="text-sm px-4 py-3 rounded-lg {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% elif message.tags == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">
        <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-check{% endif %} mr-1"></i>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
