{% if messages %}
<div id="contract-messages" class="container mx-auto mb-4 space-y-2">
    {% for message in messages %}
    <div class="text-sm px-4 py-3 rounded-xl {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% elif message.tags == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800{% else %}bg-green-50 border border-green-200 text-green-700{% endif %}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
